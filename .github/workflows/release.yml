name: Build complete Scarlet Protocol release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v1.0.0
permissions:
  contents: write
jobs:
  complete-suite:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install official runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
          python -m pip install PySide6-Essentials==6.8.3 PyInstaller==6.22.3
      - name: Build portable Desktop Studio
        run: python plasma/desktop/build_studio.py
      - name: Build portable Sound Studio
        run: python sounds/desktop/build_studio.py
      - name: Package and validate complete suite
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python tools/build_release.py --tag "$RELEASE_TAG"
      - name: Attach installable ZIP and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
