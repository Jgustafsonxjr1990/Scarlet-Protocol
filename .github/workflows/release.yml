name: Build complete Scarlet Protocol release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v1.0.0
permissions:
  contents: write
jobs:
  complete-suite:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Determine release build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'v1.0.0' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == push ]] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install official runtime build dependencies
        if: steps.release.outputs.build == 'true' 
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
          python -m pip install PySide6-Essentials==6.8.3 PyInstaller==6.22.3
      - name: Build portable Desktop Studio
        if: steps.release.outputs.build == 'true'
        run: python plasma/desktop/build_studio.py
      - name: Build portable Sound Studio
        if: steps.release.outputs.build == 'true'
        run: python sounds/desktop/build_studio.py
      - name: Package and validate complete suite
        if: steps.release.outputs.build == 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'v1.0.0' }}
        run: python tools/build_release.py --tag "$RELEASE_TAG"
      - name: Attach installable ZIP and checksum to release
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'v1.0.0' }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Scarlet Protocol $RELEASE_TAG — Complete Desktop Suite" --notes "Complete KDE Plasma 6 theme, Classic Slits frames, icons, cursors, desktop tools, Cyber Circuit sounds, matching Chrome package, pointer effects, Glitch Drag 3.0 and Phase Relay 3.0. Extract the complete ZIP and follow README.md. Linux x86-64 portable Studio apps are included; source and license notices are bundled. See component READMEs for compatibility and validation limits."
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
